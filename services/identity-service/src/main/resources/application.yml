spring:
  application:
    name: identity-service

  datasource:
    # Variables injected by Docker Compose from Vault (secret/identity/db).
    # Keys: username, password, dbname, host, port — exact match with Vault path.
    # Fail-fast on startup if any variable is absent: a placeholder with NO ':'
    # is unresolvable -> PlaceholderResolutionException. (The Compose-style
    # `${VAR:?msg}` is NOT fail-fast in Spring: everything after the first ':'
    # is a literal default value, see the jwt.signing-key note below.)
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 5

  jpa:
    # Flyway owns schema — ddl-auto must never be create or update.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

jwt:
  # HS256 signing secret. Env var ONLY — no default, no Vault client in this
  # service (see JwtService javadoc). NO fallback value: `${VAR:?msg}` is
  # Docker Compose syntax, not Spring — Spring reads everything after the
  # first ':' as a literal DEFAULT VALUE, so that form silently resolved to
  # the 28-char string "?JWT_SIGNING_KEY is required" (224 bits) whenever the
  # env var was absent, instead of failing. `${JWT_SIGNING_KEY}` with no ':'
  # at all is the actual Spring fail-fast idiom: unresolved placeholder ->
  # PlaceholderResolutionException at startup. Must be >= 32 bytes (256 bits):
  # jjwt itself rejects a shorter key with WeakKeyException (RFC 7518 §3.2).
  signing-key: ${JWT_SIGNING_KEY}

payment-service:
  # Base URL identity-service uses to cascade a user soft-delete to
  # payment-service (DELETE /payments/by-user/{userId}, see PaymentServiceClient).
  # No default, no Vault client here — same fail-fast idiom as DB_*/JWT_SIGNING_KEY.
  # (No ':?msg' form here either — see the note on datasource above.)
  url: ${PAYMENT_SERVICE_URL}

bootstrap-admin:
  # OPTIONAL first-admin bootstrap (see BootstrapAdminInitializer). Both unset
  # = feature off; exactly one set, or a weak/invalid value = the service
  # refuses to start. Unlike JWT_SIGNING_KEY this is not "required" (an
  # already-provisioned deployment needs neither), and the empty default is
  # inert: it never creates an account. Secret comes from Vault
  # (secret/identity/bootstrap-admin) via Ansible app-secrets -> .env -> Compose.
  email: ${BOOTSTRAP_ADMIN_EMAIL:}
  password: ${BOOTSTRAP_ADMIN_PASSWORD:}

login-throttle:
  # Brute-force protection of POST /login (see LoginThrottle). These are tunables,
  # NOT secrets, so safe defaults are fine (unlike DB_*/JWT_SIGNING_KEY). Counters
  # are in memory and PER REPLICA. A key (normalised email, or client IP) locked
  # after N failures inside the sliding window gets 429 + Retry-After.
  email-max-failures: ${LOGIN_THROTTLE_EMAIL_MAX_FAILURES:5}
  ip-max-failures: ${LOGIN_THROTTLE_IP_MAX_FAILURES:50}
  window-seconds: ${LOGIN_THROTTLE_WINDOW_SECONDS:900}
  max-tracked-keys: ${LOGIN_THROTTLE_MAX_TRACKED_KEYS:10000}
  # Use the rightmost X-Forwarded-For hop (added by Traefik) as the client IP.
  # false = TCP peer only (safe when exposed directly). Behind Traefik (the
  # Compose deployment, where identity publishes no port) it is set to true,
  # otherwise every user would share the proxy's single IP bucket.
  trust-forwarded-for: ${LOGIN_THROTTLE_TRUST_FORWARDED_FOR:false}

cors:
  # Browser origins allowed to call this API (see CorsConfig). Not a secret —
  # a sensible default is fine here, unlike JWT_SIGNING_KEY/DB_* above.
  # Comma-separated list, overridable per environment via CORS_ALLOWED_ORIGINS.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://admin.localhost}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # `never`: /actuator/health is routed publicly by Traefik (Host identity.localhost)
      # and `always` exposed DB/disk details to anonymous callers. Compose only needs
      # the overall status ("UP") for its healthcheck.
      show-details: never
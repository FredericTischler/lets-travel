spring:
  application:
    name: travel-service

  neo4j:
    # Variables injected by Docker Compose from Vault (secret/travel/db).
    # Keys: username, password, host, port — exact match with Vault path.
    # No "dbname": Neo4j Community Edition has a single default database.
    # Fail-fast on startup if any variable is absent: a placeholder with NO ':'
    # is unresolvable -> PlaceholderResolutionException. (The Compose-style
    # `${VAR:?msg}` is NOT fail-fast in Spring: everything after the first ':'
    # is a literal default value, see the jwt.signing-key note below. It used
    # to be used here: a missing NEO4J_PASSWORD silently became the text
    # "?NEO4J_PASSWORD is required". Proven by ConfigFailFastTest.)
    uri: bolt://${NEO4J_HOST}:${NEO4J_PORT}
    authentication:
      # Neo4j Community Edition: single admin account (username "neo4j"), no
      # per-service scoped account possible — see Neo4jConnectionConfig javadoc.
      username: ${NEO4J_USERNAME}
      password: ${NEO4J_PASSWORD}

elasticsearch:
  # Variables injected by Docker Compose from the docker-compose.travel.yml
  # fragment (see ansible/roles/elasticsearch and
  # docs/lets-travel-architecture-decisions.md §6). Dev-mode instance,
  # security disabled — no username/password to read.
  #
  # DELIBERATE DEVIATION from the NEO4J_* bare-`${VAR}` fail-fast idiom above: Neo4j is
  # this service's sole primary store, always required whenever travel-service
  # runs at all — a missing value there is a misconfiguration, never a valid
  # state. Elasticsearch is optional, additive infra behind its OWN Compose
  # profile (`search`, not part of `core`/`full`) — travel-service MUST stay
  # bootable (CRUD, transports, existing test suite) when `search` is not up
  # and ES_HOST/ES_PORT are not set by the environment at all (e.g. plain
  # `mvn test`, or `full` without `search`). A bare `${VAR}` placeholder here would make
  # every one of those cases fail to start, defeating the whole point of an
  # additive profile. The defaults below point at nothing real in production
  # (docker-compose.travel.yml always overrides them to the `elasticsearch`
  # service name/port when the fragment is included) — connectivity is only
  # ever checked lazily, at the first search/autocomplete request
  # (ElasticsearchConnectionConfig does not probe the connection at startup),
  # so an unreachable default surfaces as a 503 on that one endpoint, not a
  # boot failure.
  host: ${ES_HOST:localhost}
  port: ${ES_PORT:9200}

jwt:
  # HS256 signing secret used to VALIDATE tokens issued by identity-service.
  # Must be the exact same value as identity-service's own JWT_SIGNING_KEY
  # (shared HS256 secret — see JwtService javadoc). Env var ONLY — no
  # default, no Vault client in this service. NO fallback value: `${VAR:?msg}`
  # is Docker Compose syntax, not Spring — Spring reads everything after the
  # first ':' as a literal DEFAULT VALUE, so that form silently resolved to
  # the 28-char string "?JWT_SIGNING_KEY is required" (224 bits) whenever the
  # env var was absent, instead of failing (this is exactly what broke this
  # service's own boot in CI: JwtService builds the signing key eagerly in a
  # @PostConstruct, so the weak fallback surfaced as a WeakKeyException here
  # instead of the intended fail-fast). `${JWT_SIGNING_KEY}` with no ':' at
  # all is the actual Spring fail-fast idiom: unresolved placeholder ->
  # PlaceholderResolutionException at startup.
  signing-key: ${JWT_SIGNING_KEY}

payment-service:
  # Base URL of payment-service, called to create the payment of a paid
  # subscription — see PaymentServiceClient and
  # docs/lets-travel-architecture-decisions.md §4. Env var ONLY, no default (same
  # `${VAR}` fail-fast idiom as jwt.signing-key above: an unresolved placeholder
  # aborts startup, no silent default for a service URL).
  url: ${PAYMENT_SERVICE_URL}

dashboard:
  # Currency of the scalar income amounts and of the income component of the
  # manager performance score (PerformanceScore). Incomes in other currencies
  # are reported per currency but not converted, so not scored. Not a secret or a
  # URL, so a plain default is fine (ADR "Dashboards" addendum).
  reference-currency: ${DASHBOARD_REFERENCE_CURRENCY:EUR}

subscription:
  # How long an unpaid PENDING_PAYMENT subscription keeps its seat before it is
  # read as EXPIRED and stops counting toward capacity (ADR §4 addendum). Not
  # secrets/URLs, so plain defaults are fine (unlike the values above). Stripe
  # and PayPal are interactive checkouts: 60 minutes. MANUAL payments are
  # confirmed by an administrator out of band (bank transfer, cash): 72 hours.
  pending-ttl-minutes: ${SUBSCRIPTION_PENDING_TTL_MINUTES:60}
  pending-ttl-manual-minutes: ${SUBSCRIPTION_PENDING_TTL_MANUAL_MINUTES:4320}

cors:
  # Browser origins allowed to call this API (see CorsConfig). Not a secret —
  # a sensible default is fine here, unlike JWT_SIGNING_KEY/NEO4J_* above.
  # Comma-separated list, overridable per environment via CORS_ALLOWED_ORIGINS.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://admin.localhost}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # `never`: /actuator/health is routed publicly by Traefik and `always`
      # exposed Neo4j/disk details to anonymous callers. The Docker healthcheck
      # only needs the overall status ("UP") — see docker-compose.travel.yml.
      show-details: never
  health:
    # Disable Spring Boot Actuator's built-in Elasticsearch health indicator
    # (auto-activated by the mere presence of the org.elasticsearch.client.RestClient
    # bean, see ElasticsearchConnectionConfig — nothing here opted into it
    # explicitly). Left enabled, an unreachable Elasticsearch drags the whole
    # service's aggregated /actuator/health to DOWN (503) — exactly what
    # docs/lets-travel-architecture-decisions.md §6 says must NOT happen:
    # Elasticsearch is optional/additive (profile `search`), travel-service
    # must stay reported healthy (CRUD/Neo4j/transports all fine) whenever
    # `search` simply isn't up. Search/autocomplete degrade on their own via
    # SearchUnavailableException (503 on THOSE two endpoints only) — that's
    # the correct, narrow failure signal, not a global health flag.
    elasticsearch:
      enabled: false
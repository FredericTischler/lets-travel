# Test-only defaults. Production has NO default for these (see application.yml:
# fail-fast `${VAR}` placeholders) — they exist here only so the many test
# classes that never touch payment-service don't each have to register
# PAYMENT_SERVICE_URL. Nothing listens on port 1, so an unexpected outbound call
# fails fast (connection refused) instead of hanging.
# Tests that exercise the payment call override it via @DynamicPropertySource.
PAYMENT_SERVICE_URL=http://localhost:1

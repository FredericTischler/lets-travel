<div class="flex flex-wrap items-center justify-between gap-2 border-t border-line-strong pt-3 text-sm text-ink-dim">
  <span data-testid="paginator-summary">
    {{
      'Page {{page}} sur {{total}} ({{count}} au total)'
        | translate: { page: page() + 1, total: totalPages(), count: totalElements() }
    }}
  </span>
  <div class="flex gap-2">
    <app-button
      variant="secondary"
      [disabled]="disabled() || !hasPrevious()"
      (clicked)="previous()"
    >
      {{ 'Précédent' | translate }}
    </app-button>
    <app-button
      variant="secondary"
      [disabled]="disabled() || !hasNext()"
      (clicked)="next()"
    >
      {{ 'Suivant' | translate }}
    </app-button>
  </div>
</div>

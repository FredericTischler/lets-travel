<div class="flex flex-col gap-1">
  <label [for]="fieldId()" class="text-sm font-medium text-slate-700 dark:text-slate-200">{{
    label()
  }}</label>
  <input
    [id]="fieldId()"
    [type]="type()"
    [required]="required()"
    [autocomplete]="autocomplete()"
    [disabled]="disabled"
    [value]="displayValue"
    (input)="handleInput($any($event.target).value)"
    (blur)="handleBlur()"
    class="rounded-md border px-3 py-1.5 text-sm text-slate-900 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:cursor-not-allowed disabled:opacity-50 dark:bg-slate-800 dark:text-slate-100"
    [class.border-red-500]="error()"
    [class.border-slate-300]="!error()"
    [class.dark:border-slate-600]="!error()"
  />
  @if (error()) {
    <p class="text-sm text-red-600 dark:text-red-400">{{ error() }}</p>
  }
</div>

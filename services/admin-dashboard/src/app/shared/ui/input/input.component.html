<div class="flex flex-col gap-1.5">
  <label [for]="fieldId()" class="font-mono text-xs tracking-wide text-ink-dim uppercase">{{
    label()
  }}</label>
  <input
    [id]="fieldId()"
    [type]="type()"
    [required]="required()"
    [autocomplete]="autocomplete()"
    [disabled]="disabled"
    [value]="displayValue"
    (input)="handleInput($any($event.target).value)"
    (blur)="handleBlur()"
    class="border-0 border-b-2 bg-transparent px-1 py-1.5 font-mono text-sm text-ink focus:border-amber focus:outline-none disabled:cursor-not-allowed disabled:opacity-50"
    [class.border-red]="error()"
    [class.border-line-strong]="!error()"
  />
  @if (error()) {
    <p class="text-sm text-red">{{ error() }}</p>
  }
</div>

<div class="min-h-screen bg-white text-slate-900 dark:bg-slate-900 dark:text-slate-100">
  <header
    class="flex items-center justify-between gap-4 border-b border-slate-200 px-6 py-4 dark:border-slate-700"
  >
    <nav class="flex gap-4 text-sm font-medium">
      <a
        routerLink="/users"
        routerLinkActive="text-indigo-600 dark:text-indigo-400"
        class="text-slate-600 hover:text-indigo-600 dark:text-slate-300 dark:hover:text-indigo-400"
        >Utilisateurs</a
      >
      <a
        routerLink="/payments"
        routerLinkActive="text-indigo-600 dark:text-indigo-400"
        class="text-slate-600 hover:text-indigo-600 dark:text-slate-300 dark:hover:text-indigo-400"
        >Paiements</a
      >
      <a
        routerLink="/destinations"
        routerLinkActive="text-indigo-600 dark:text-indigo-400"
        class="text-slate-600 hover:text-indigo-600 dark:text-slate-300 dark:hover:text-indigo-400"
        >Destinations</a
      >
    </nav>

    <button
      type="button"
      (click)="themeService.toggle()"
      class="rounded-md border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100 dark:border-slate-600 dark:text-slate-200 dark:hover:bg-slate-800"
    >
      {{ themeService.theme() === 'dark' ? 'Mode clair' : 'Mode sombre' }}
    </button>
  </header>

  <main class="p-6">
    <router-outlet />
  </main>
</div>

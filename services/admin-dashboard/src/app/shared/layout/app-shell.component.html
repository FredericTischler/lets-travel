<div class="min-h-screen bg-white text-slate-900 dark:bg-slate-900 dark:text-slate-100">
  <header class="border-b border-slate-200 dark:border-slate-700">
    <div class="flex flex-wrap items-center justify-between gap-3 px-4 py-3 lg:flex-nowrap lg:px-6">
      <span class="text-base font-semibold text-indigo-600 dark:text-indigo-400">Let's Travel</span>

      <button
        type="button"
        class="rounded-md border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100 lg:hidden dark:border-slate-600 dark:text-slate-200 dark:hover:bg-slate-800"
        aria-controls="main-menu"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        @if (menuOpen()) {
          <span i18n="@@shell.menuClose">Fermer</span>
        } @else {
          <span i18n="@@shell.menuOpen">Menu</span>
        }
      </button>

      <div
        id="main-menu"
        class="w-full flex-col gap-4 lg:flex lg:w-auto lg:flex-1 lg:flex-row lg:items-center lg:justify-between"
        [class.hidden]="!menuOpen()"
        [class.flex]="menuOpen()"
      >
        <nav aria-label="Navigation principale" i18n-aria-label="@@shell.navLabel">
          <ul class="flex flex-col gap-2 text-sm font-medium lg:flex-row lg:flex-wrap lg:gap-x-4 lg:gap-y-1">
            @for (item of navItems(); track item.route) {
              <li>
                <a
                  [routerLink]="item.route"
                  routerLinkActive="text-indigo-600 dark:text-indigo-400"
                  class="block whitespace-nowrap py-1 text-slate-600 hover:text-indigo-600 dark:text-slate-300 dark:hover:text-indigo-400"
                  (click)="closeMenu()"
                  >{{ item.label }}</a
                >
              </li>
            }
          </ul>
        </nav>

        <div class="flex flex-wrap items-center gap-3">
          @if (email()) {
            <span class="max-w-48 truncate text-sm text-slate-600 dark:text-slate-300">{{
              email()
            }}</span>
          }
          @if (roleLabel()) {
            <app-badge tone="info">{{ roleLabel() }}</app-badge>
          }

          <button
            type="button"
            (click)="themeService.toggle()"
            class="rounded-md border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100 dark:border-slate-600 dark:text-slate-200 dark:hover:bg-slate-800"
          >
            @if (themeService.theme() === 'dark') {
              <span i18n="@@shell.themeToLight">Mode clair</span>
            } @else {
              <span i18n="@@shell.themeToDark">Mode sombre</span>
            }
          </button>

          <button
            type="button"
            (click)="logout()"
            class="rounded-md border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100 dark:border-slate-600 dark:text-slate-200 dark:hover:bg-slate-800"
            i18n="@@shell.logout"
          >
            Se déconnecter
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="p-4 md:p-6">
    <router-outlet />
  </main>
</div>

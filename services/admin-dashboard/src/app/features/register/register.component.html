<div class="flex min-h-screen items-center justify-center bg-white p-4 dark:bg-slate-900 md:p-6">
  <div class="w-full max-w-sm">
    <h1 class="mb-4 text-2xl font-semibold text-slate-900 dark:text-slate-100">Créer un compte</h1>

    <app-card>
      <form class="flex flex-col gap-4" (ngSubmit)="submit()">
        <app-input
          fieldId="email"
          name="email"
          label="Email"
          type="email"
          [(ngModel)]="email"
          [required]="true"
          autocomplete="username"
        />

        <app-input
          fieldId="password"
          name="password"
          label="Mot de passe"
          type="password"
          [(ngModel)]="password"
          [required]="true"
          autocomplete="new-password"
        />
        <p class="-mt-2 text-xs text-slate-500 dark:text-slate-400">
          {{ minPasswordLength }} caractères minimum.
        </p>

        <fieldset class="flex flex-col gap-2">
          <legend class="mb-1 text-sm font-medium text-slate-700 dark:text-slate-200">
            Je souhaite être
          </legend>
          @for (option of roles; track option.value) {
            <label
              class="flex cursor-pointer items-start gap-2 rounded-md border border-slate-300 p-2 text-sm dark:border-slate-600"
            >
              <input
                type="radio"
                name="role"
                class="mt-1"
                [value]="option.value"
                [attr.value]="option.value"
                [(ngModel)]="role"
              />
              <span>
                <span class="block font-medium text-slate-900 dark:text-slate-100">{{ option.label }}</span>
                <span class="block text-slate-500 dark:text-slate-400">{{ option.hint }}</span>
              </span>
            </label>
          }
        </fieldset>

        @if (error()) {
          <app-alert variant="error">{{ error() }}</app-alert>
        }

        <app-button type="submit" [disabled]="submitting()">
          {{ submitting() ? 'Création…' : 'Créer mon compte' }}
        </app-button>
      </form>
    </app-card>

    <p class="mt-4 text-sm text-slate-600 dark:text-slate-300">
      Déjà un compte ?
      <a routerLink="/login" class="font-medium text-indigo-600 hover:underline dark:text-indigo-400"
        >Se connecter</a
      >
    </p>
  </div>
</div>

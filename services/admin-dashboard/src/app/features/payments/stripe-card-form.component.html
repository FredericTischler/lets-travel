<div class="flex flex-col gap-3" data-testid="stripe-card-form">
  @if (loadError()) {
    <app-alert variant="error">{{ loadError() }}</app-alert>
  } @else {
    @if (loading()) {
      <p class="text-sm text-slate-600 dark:text-slate-300" data-testid="stripe-card-loading">
        Chargement du formulaire de paiement…
      </p>
    }

    <div
      #cardElement
      class="rounded-md border border-slate-300 bg-white px-3 py-2.5 dark:border-slate-600 dark:bg-slate-900"
      data-testid="stripe-card-element"
    ></div>

    @if (cardError()) {
      <app-alert variant="error">{{ cardError() }}</app-alert>
    }

    <div>
      <app-button [disabled]="!cardReady() || paying()" (clicked)="pay()">
        {{ paying() ? 'Paiement en cours…' : 'Payer par carte' }}
      </app-button>
    </div>
  }
</div>

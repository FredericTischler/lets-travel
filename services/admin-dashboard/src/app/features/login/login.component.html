<div class="flex min-h-screen items-center justify-center bg-white p-6 dark:bg-slate-900">
  <div class="w-full max-w-sm">
    <h1 class="mb-4 text-2xl font-semibold text-slate-900 dark:text-slate-100" i18n="@@login.title">
      Connexion
    </h1>

    <app-card>
      <form class="flex flex-col gap-4" (ngSubmit)="submit()">
        <app-input
          fieldId="email"
          name="email"
          label="Email"
          i18n-label="@@login.emailLabel"
          type="email"
          [(ngModel)]="email"
          [required]="true"
          autocomplete="username"
        />

        <app-input
          fieldId="password"
          name="password"
          label="Mot de passe"
          i18n-label="@@login.passwordLabel"
          type="password"
          [(ngModel)]="password"
          [required]="true"
          autocomplete="current-password"
        />

        @if (error()) {
          <app-alert variant="error">{{ error() }}</app-alert>
        }

        <app-button type="submit" [disabled]="submitting()">
          @if (submitting()) {
            <span i18n="@@login.submitting">Connexion…</span>
          } @else {
            <span i18n="@@login.submit">Se connecter</span>
          }
        </app-button>
      </form>
    </app-card>

    <p class="mt-4 text-sm text-slate-600 dark:text-slate-300" i18n="@@login.noAccount">
      Pas encore de compte ?
      <a
        routerLink="/register"
        class="font-medium text-indigo-600 hover:underline dark:text-indigo-400"
        >Créer un compte</a
      >
    </p>
  </div>
</div>

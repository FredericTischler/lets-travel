<!doctype html>
<html lang="en">
<head>
  <script>
    // Apply the persisted theme choice to <html> before first paint, so a
    // reload respects the user's last choice without a flash of the wrong
    // theme. Kept in sync with ThemeService (same storage key/class).
    (function () {
      try {
        if (localStorage.getItem('admin-dashboard.theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="utf-8">
  <title>Admin Dashboard</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>

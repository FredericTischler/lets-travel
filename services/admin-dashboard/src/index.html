<!doctype html>
<html lang="en">
<head>
  <script>
    // Apply the persisted theme choice to <html> before first paint, so a
    // reload respects the user's last choice without a flash of the wrong
    // theme. Kept in sync with ThemeService (same storage key/class).
    (function () {
      try {
        if (localStorage.getItem('admin-dashboard.theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="utf-8">
  <title>Admin Dashboard</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  >
</head>
<body>
  <app-root></app-root>
</body>
</html>

# Static SPA server for the Angular build. nginx-unprivileged's base image
# already listens on 8080 as a non-root user; this file only replaces its
# default site config (routing + healthcheck), not the server-level directives.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (Angular Router, no server-side routes to match):
    # any path that isn't a real static file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames (outputHashing: all) never change content under the
    # same name: safe to cache indefinitely.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Compose healthcheck target (see docker-compose.admin-dashboard.yml).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}

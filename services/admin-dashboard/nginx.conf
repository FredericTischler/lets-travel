# Config Nginx du conteneur admin-dashboard (voir Dockerfile). Sert le build
# Angular statique sur le port 80 ; Traefik termine le TLS en amont, exactement
# comme les 3 backends Spring Boot (voir docker-compose.admin-dashboard.yml).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Healthcheck du conteneur (docker-compose.admin-dashboard.yml) : toujours
    # 200 tant que Nginx sert le contenu, pas de dépendance à une base.
    location = / {
        try_files /index.html =404;
    }

    # Fallback SPA : toute route Angular (ex. /travels, /manager/dashboard)
    # n'existe pas comme fichier côté serveur — Nginx retombe sur index.html
    # et c'est le router Angular (app.routes.ts) qui décide de l'écran.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers immuables (hash dans le nom, cf. outputHashing=all en prod) :
    # cache long côté navigateur, sans risque puisqu'un nouveau build change
    # le nom de fichier.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

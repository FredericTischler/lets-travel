spring:
  application:
    name: payment-service

  datasource:
    # Variables injected by Docker Compose from Vault (secret/payment/db).
    # Keys: username, password, dbname, host, port — exact match with Vault path.
    # Fail-fast on startup if any variable is absent (Spring Boot enforces :?).
    url: jdbc:postgresql://${DB_HOST:?DB_HOST is required}:${DB_PORT:?DB_PORT is required}/${DB_NAME:?DB_NAME is required}
    username: ${DB_USERNAME:?DB_USERNAME is required}
    password: ${DB_PASSWORD:?DB_PASSWORD is required}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 5

  jpa:
    # Flyway owns schema — ddl-auto must never be create or update.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

jwt:
  # HS256 signing secret used to VALIDATE tokens issued by identity-service.
  # Must be the exact same value as identity-service's own JWT_SIGNING_KEY
  # (shared HS256 secret — see JwtService javadoc). Env var ONLY — no
  # default, no Vault client in this service. NO fallback value: `${VAR:?msg}`
  # is Docker Compose syntax, not Spring — Spring reads everything after the
  # first ':' as a literal DEFAULT VALUE, so that form silently resolved to
  # the 28-char string "?JWT_SIGNING_KEY is required" (224 bits) whenever the
  # env var was absent, instead of failing. `${JWT_SIGNING_KEY}` with no ':'
  # at all is the actual Spring fail-fast idiom: unresolved placeholder ->
  # PlaceholderResolutionException at startup.
  signing-key: ${JWT_SIGNING_KEY}

stripe:
  # Sandbox/test credentials only (sk_test_*) — see StripeConfig. Vault path
  # secret/payment/stripe (keys api_key, secret_key). No default, no Vault
  # client here — same fail-fast idiom as jwt.signing-key above: `${VAR}` with
  # no ':' fails startup with PlaceholderResolutionException if absent.
  # api-key is bound (and validated as present) for parity with the Vault
  # path and a possible future client-side confirmation flow, but only
  # secret-key is actually used to authenticate server-side calls today (see
  # StripeConfig javadoc).
  api-key: ${STRIPE_API_KEY}
  secret-key: ${STRIPE_SECRET_KEY}
  # Signing secret for POST /webhooks/stripe (Stripe dashboard -> webhook
  # endpoint -> "Signing secret", whsec_*). NOT YET provisioned via
  # Ansible/Vault/docker-compose as of this increment — this is application
  # code only; wiring STRIPE_WEBHOOK_SECRET through Vault (secret/payment/stripe,
  # key webhook_secret) and docker-compose.payment.yml is a separate infra
  # task. Same fail-fast idiom as the other stripe.*/paypal.* keys above:
  # `${VAR}` with no ':' fails startup with PlaceholderResolutionException if
  # absent — never a silent default for a secret.
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}

paypal:
  # Sandbox credentials only — see PayPalConfig. Vault path secret/payment/paypal
  # (keys client_id, client_secret). Same fail-fast idiom as above.
  client-id: ${PAYPAL_CLIENT_ID}
  client-secret: ${PAYPAL_CLIENT_SECRET}

travel-service:
  # Base URL of travel-service, called (best-effort) to report the outcome of a
  # subscription-linked payment — see TravelServiceClient and
  # docs/lets-travel-architecture-decisions.md §4. Env var ONLY, no default (same
  # `${VAR}` fail-fast idiom as jwt.signing-key above: an unresolved placeholder
  # aborts startup, no silent default for a service URL).
  url: ${TRAVEL_SERVICE_URL}

cors:
  # Browser origins allowed to call this API (see CorsConfig). Not a secret —
  # a sensible default is fine here, unlike JWT_SIGNING_KEY/DB_* above.
  # Comma-separated list, overridable per environment via CORS_ALLOWED_ORIGINS.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://admin.localhost}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
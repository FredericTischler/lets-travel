# Test-only defaults. Production has NO default for these (see application.yml:
# fail-fast `${VAR}` placeholders) — they exist here only so the many test
# classes that never touch the travel-service callback don't each have to
# register TRAVEL_SERVICE_URL. Nothing listens on port 1, so an unexpected
# outbound call fails fast (connection refused) instead of hanging.
# Tests that exercise the callback override it via @DynamicPropertySource.
TRAVEL_SERVICE_URL=http://localhost:1

---
# Prepare : python3 dans la plateforme Debian (requis par les modules Ansible).
- name: Prepare platform (python3 for Molecule lifecycle)
  hosts: all
  gather_facts: false
  tasks:
    - name: "Install python3 in the Debian platform (raw: python not present yet)"
      ansible.builtin.raw: >-
        apt-get update -qq &&
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3
      changed_when: false

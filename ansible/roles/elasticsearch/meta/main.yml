    8 Go). Aucun provisioning d'index/mapping : ça relève de travel-service
    (applicatif), même séparation des responsabilités que le rôle `neo4j`.
    Volontairement PAS de suite molecule (voir §6 du document de décision) :
    un seul conteneur, aucune logique de provisioning au-delà du fragment
    Compose lui-même.

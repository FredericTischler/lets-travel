---
# Playbook de test/application LOCAL du rôle sonarqube.
# Self-contained : charge le rôle par son chemin absolu (= playbook_dir, puisque ce
# fichier est à la racine du rôle). Aucun roles_path ni export shell requis.
#
# ATTENTION — ce playbook a DEUX effets réels sur la machine :
#   1. Il écrit sous /opt/travel-plan/sonarqube le fragment compose.sonarqube.yml.
#   2. Il MODIFIE DES SYSCTL DE L'HÔTE (vm.max_map_count=524288,
#      fs.file-max=131072) et les PERSISTE dans
#      /etc/sysctl.d/99-travel-plan-sonarqube.conf.
#      Ce n'est pas un effet de bord évitable : l'Elasticsearch embarqué de
#      SonarQube refuse de démarrer sous ces seuils, et ces sysctl ne sont PAS
#      namespacés par conteneur (donc impossibles à poser via Compose).
#      Pour s'en abstenir (hôte géré autrement) :
#        -e sonarqube_manage_sysctl=false
#
# Il NE démarre AUCUN conteneur et ne configure RIEN dans SonarQube (pas de
# token, pas de quality gate) : conforme au modèle « Ansible provisionne,
# Compose orchestre » déjà en place pour postgres/vault/neo4j/traefik/jenkins.
#
# PRÉREQUIS AVANT `docker compose --profile ci up -d` : la variable
# SONARQUBE_DB_PASSWORD doit exister dans /opt/travel-plan/.env (rendu par le
# rôle app-secrets depuis Vault). Ce rôle n'y écrit PAS — app-secrets en est le
# propriétaire unique. Voir le README du rôle, section « Base dédiée ».
#
# Lancement (depuis la racine du projet, venv activé) :
#   ansible-playbook ansible/roles/sonarqube/test-local.yml -K
- name: Provisionner le serveur SonarQube (local)
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  roles:
    - role: "{{ playbook_dir }}"
